<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asistencia Escolar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 8px;
      font-size: 1.5rem;
    }

    p.sub {
      text-align: center;
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background-color: #0284c7;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #0369a1;
    }

    button:active {
      transform: scale(0.98);
    }

    #mensaje {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .exito {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .error {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Control de Asistencia</h2>
    <p class="sub">Ingresa tus datos para registrar la llegada</p>

    <form id="formAsistencia">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="nie">NIE / Código Estudiantil</label>
        <input type="number" id="nie" placeholder="Ej. 1234567" required>
      </div>

      <div class="form-group">
        <label for="clave">Clave de Confirmación</label>
        <input type="password" id="clave" placeholder="Ingresa la clave del día" required>
      </div>

      <button type="submit" id="btnEnviar">Registrar Asistencia</button>
    </form>

    <div id="mensaje"></div>
  </div>

  <script>
    const CLAVE_CORRECTA = "cantor2026";
    // Si usas Google Apps Script para guardar en Drive, coloca tu URL aquí:
    const SCRIPT_URL = "TU_URL_DE_GOOGLE_APPS_SCRIPT"; 

    const formulario = document.getElementById('formAsistencia');
    const mensajeDiv = document.getElementById('mensaje');
    const btnEnviar = document.getElementById('btnEnviar');

    formulario.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value.trim();
      const nie = document.getElementById('nie').value.trim();
      const clave = document.getElementById('clave').value.trim();

      // Validación de clave
      if (clave !== CLAVE_CORRECTA) {
        mostrarMensaje("Clave incorrecta. Pide la clave al docente.", "error");
        return;
      }

      btnEnviar.disabled = true;
      btnEnviar.textContent = "Guardando...";

      const fechaHora = new Date().toLocaleString("es-SV", { timeZone: "America/El_Salvador" });

      try {
        if (SCRIPT_URL !== "TU_URL_DE_GOOGLE_APPS_SCRIPT") {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, nie, fechaHora })
          });
        }

        mostrarMensaje(`¡Asistencia registrada con éxito! (${fechaHora})`, "exito");
        formulario.reset();
      } catch (err) {
        mostrarMensaje("Ocurrió un error al guardar. Inténtalo de nuevo.", "error");
        console.error(err);
      } finally {
        btnEnviar.disabled = false;
        btnEnviar.textContent = "Registrar Asistencia";
      }
    });

    function mostrarMensaje(texto, tipo) {
      mensajeDiv.textContent = texto;
      mensajeDiv.className = tipo;
      mensajeDiv.style.display = "block";
    }
  </script>
</body>
</html>
