<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla Asistente IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: #0f172a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* AVATAR Y ANIMACIÓN */
    .avatar-box {
      text-align: center;
      margin-bottom: 20px;
    }

    .avatar-img {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 4px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      object-fit: cover;
      transition: transform 0.2s ease-in-out;
    }

    /* Efecto de hablar */
    .hablando {
      animation: rebotar 0.5s infinite alternate;
      border-color: #4ade80;
      box-shadow: 0 0 30px rgba(74, 222, 128, 0.6);
    }

    @keyframes rebotar {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .globo-texto {
      background: #1e293b;
      padding: 15px 20px;
      border-radius: 12px;
      max-width: 380px;
      margin-top: 15px;
      font-size: 1rem;
      border: 1px solid #334155;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* BOTÓN DE ESCUCHA */
    .btn-hablar {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.2s;
    }

    .btn-hablar:hover { background: #0369a1; }

    /* TARJETA QR EN LA ESQUINA */
    .qr-card {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: #ffffff;
      color: #0f172a;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .qr-card img {
      width: 120px;
      height: 120px;
      display: block;
      margin: 0 auto 6px auto;
    }

    .qr-card p {
      font-size: 0.75rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- SECCIÓN CENTRAL: AVATAR IA -->
  <div class="avatar-box">
    <img id="avatar" class="avatar-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1ZHdyM3UxaTNzbTh0MHV1NmR1eXRqczh1ZnlwM2NxbnhpNmI4OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKSjRrfIPjeiVyM/giphy.gif" alt="Robot IA">
    
    <div id="globoTexto" class="globo-texto">¡Hola! Soy tu asistente. Presiona para preguntar.</div>
    
    <button id="btnEscuchar" class="btn-hablar">🎤 Presiona para Preguntar</button>
  </div>

  <!-- SECCIÓN ESQUINA: CÓDIGO QR GENERADO AUTOMÁTICAMENTE -->
  <div class="qr-card">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://andercol852-dev.github.io/control-asistencia/" alt="QR Asistencia">
    <p>Escanea aquí para<br>PASAR ASISTENCIA</p>
  </div>

  <script>
    const GEMINI_API_KEY = "AQ.Ab8RN6KRH1Ugr51bqvhck46EP2lSLdIYPWoKwcC45mYoxD6P2A"; 
    const avatar = document.getElementById('avatar');
    const globoTexto = document.getElementById('globoTexto');
    const btnEscuchar = document.getElementById('btnEscuchar');

    // Hablar con voz sintética y animar avatar
    function hablar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const mensaje = new SpeechSynthesisUtterance(texto);
        mensaje.lang = 'es-ES';

        mensaje.onstart = () => avatar.classList.add('hablando');
        mensaje.onend = () => avatar.classList.remove('hablando');

        window.speechSynthesis.speak(mensaje);
      }
    }

    // Reconocimiento de Voz
    const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (Reconocimiento) {
      const oyente = new Reconocimiento();
      oyente.lang = 'es-ES';

      oyente.onstart = () => {
        globoTexto.textContent = "Te estoy escuchando...";
      };

      oyente.onresult = (e) => {
        const pregunta = e.results[0][0].transcript;
        globoTexto.textContent = `Pregunta: "${pregunta}"`;
        consultarIA(pregunta);
      };

      btnEscuchar.addEventListener('click', () => oyente.start());
    } else {
      btnEscuchar.style.display = 'none';
      globoTexto.textContent = "Usa Chrome para soporte de voz.";
    }

    // Consultar API Gemini
    async function consultarIA(pregunta) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
      globoTexto.textContent = "Pensando...";

      try {
        const respuesta = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `Eres un robot asistente escolar en el aula. Responde muy brevemente (máximo 2 oraciones) y amable a: ${pregunta}` }]
            }]
          })
        });

        const datos = await respuesta.json();
        const textoRespuesta = datos.candidates[0].content.parts[0].text;
        
        globoTexto.textContent = textoRespuesta;
        hablar(textoRespuesta);
      } catch (err) {
        globoTexto.textContent = "Error al conectar con la IA.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
