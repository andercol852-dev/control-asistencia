<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente IA - Pantalla Robot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* CONTENEDOR AVATAR */
    .avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 90%;
      z-index: 1;
    }

    .avatar-img {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid #38bdf8;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
      object-fit: cover;
      transition: all 0.3s ease;
    }

    /* Animación cuando habla */
    .hablando {
      animation: pulso 0.6s infinite alternate;
      border-color: #4ade80;
      box-shadow: 0 0 35px rgba(74, 222, 128, 0.7);
    }

    @keyframes pulso {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    /* GLOBO DE TEXTO */
    .globo-texto {
      background: #1e293b;
      padding: 16px 22px;
      border-radius: 16px;
      max-width: 420px;
      margin-top: 20px;
      font-size: 1.1rem;
      border: 1px solid #334155;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      line-height: 1.4;
    }

    /* BOTÓN DE VOZ */
    .btn-hablar {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }

    .btn-hablar:hover {
      background: #0369a1;
    }

    .btn-hablar:active {
      transform: scale(0.96);
    }

    /* TARJETA QR EN LA ESQUINA */
    .qr-card {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: #ffffff;
      color: #0f172a;
      padding: 12px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      z-index: 2;
    }

    .qr-card img {
      width: 120px;
      height: 120px;
      display: block;
      margin: 0 auto 8px auto;
      border-radius: 6px;
    }

    .qr-card p {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.2;
    }

    @media (max-width: 600px) {
      .avatar-img { width: 150px; height: 150px; }
      .qr-card { bottom: 12px; right: 12px; padding: 8px; }
      .qr-card img { width: 90px; height: 90px; }
      .qr-card p { font-size: 0.65rem; }
    }
  </style>
</head>
<body>

  <!-- SECCIÓN AVATAR E INTERACCIÓN -->
  <div class="avatar-container">
    <img id="avatar" class="avatar-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1ZHdyM3UxaTNzbTh0MHV1NmR1eXRqczh1ZnlwM2NxbnhpNmI4OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKSjRrfIPjeiVyM/giphy.gif" alt="Avatar Robot">
    
    <div id="globoTexto" class="globo-texto">¡Hola! Soy tu asistente. Presiona el botón para consultar.</div>
    
    <button id="btnEscuchar" class="btn-hablar">🎤 Presiona para Hablar</button>
  </div>

  <!-- SECCIÓN CÓDIGO QR MÓVIL DE ASISTENCIA -->
  <div class="qr-card">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://andercol852-dev.github.io/control-asistencia/" alt="QR Asistencia">
    <p>Escanea para<br>REGISTRAR ASISTENCIA</p>
  </div>

  <script>
    const GEMINI_API_KEY = "AQ.Ab8RN6LfXTZZjYvs3tNjepgjzlbjXEt7EPbo1kMgGkajlBXVBA";
    
    const avatar = document.getElementById('avatar');
    const globoTexto = document.getElementById('globoTexto');
    const btnEscuchar = document.getElementById('btnEscuchar');

    // Reproducción de voz y animación
    function hablar(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const mensaje = new SpeechSynthesisUtterance(texto);
        mensaje.lang = 'es-ES';
        mensaje.rate = 1.0;

        mensaje.onstart = () => avatar.classList.add('hablando');
        mensaje.onend = () => avatar.classList.remove('hablando');
        mensaje.onerror = () => avatar.classList.remove('hablando');

        window.speechSynthesis.speak(mensaje);
      }
    }

    // Reconocimiento de Voz por micrófono
    const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (Reconocimiento) {
      const oyente = new Reconocimiento();
      oyente.lang = 'es-ES';
      oyente.continuous = false;
      oyente.interimResults = false;

      oyente.onstart = () => {
        globoTexto.textContent = "Te estoy escuchando...";
      };

      oyente.onresult = (e) => {
        const pregunta = e.results[0][0].transcript;
        globoTexto.textContent = `Pregunta: "${pregunta}"`;
        consultarIA(pregunta);
      };

      oyente.onerror = (e) => {
        globoTexto.textContent = "No pude escucharte bien. Intenta de nuevo.";
      };

      btnEscuchar.addEventListener('click', () => {
        try {
          oyente.start();
        } catch(err) {
          console.log("El micrófono ya estaba activo.");
        }
      });
    } else {
      btnEscuchar.style.display = 'none';
      globoTexto.textContent = "Usa Google Chrome para habilitar la interacción por voz.";
    }

    // Petición a la API de Gemini
    async function consultarIA(pregunta) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
      globoTexto.textContent = "Pensando respuesta...";

      try {
        const respuesta = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `Eres un asistente educativo en un robot escolar. Responde en español de forma muy breve (máximo 2 oraciones) a: ${pregunta}` }]
            }]
          })
        });

        const datos = await respuesta.json();
        
        if (datos.candidates && datos.candidates[0].content.parts[0].text) {
          const textoRespuesta = datos.candidates[0].content.parts[0].text;
          globoTexto.textContent = textoRespuesta;
          hablar(textoRespuesta);
        } else {
          globoTexto.textContent = "No pude generar una respuesta.";
        }
      } catch (err) {
        globoTexto.textContent = "Error de conexión con la IA.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
